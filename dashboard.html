<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #172033;
}

header {
    background: #172554;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h2 {
    margin: 0;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 6px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: 0.85;
}

.logout {
    background: #dc2626;
}

.container {
    max-width: 1050px;
    margin: 30px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 23px;
    border-radius: 10px;
    margin-bottom: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

h3 {
    color: #172554;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.form-button {
    margin-top: 18px;
}

.item {
    padding: 15px;
    border: 1px solid #e2e8f0;
    border-radius: 7px;
    margin-top: 12px;
}

.item button {
    margin: 8px 5px 0 0;
}

.delete {
    background: #dc2626;
}

.secondary {
    background: #475569;
}

#message {
    margin-top: 15px;
    overflow-wrap: anywhere;
}

#dashboard {
    display: none;
}

#loading {
    text-align: center;
    padding: 50px 15px;
}

</style>
</head>

<body>

<header>
    <h2>Portfolio Admin Dashboard</h2>
    <button class="logout" id="logoutBtn">Logout</button>
</header>

<div id="loading">Checking administrator access...</div>

<div class="container" id="dashboard">

    <div class="card">
        <h3>Welcome, Administrator</h3>
        <p>Manage your personal portfolio from this dashboard.</p>
        <p id="message"></p>
    </div>

    <!-- PROFILE MANAGEMENT -->

    <div class="card">
        <h3>Profile Management</h3>

        <label>Display Name</label>
        <input id="displayName" type="text">

        <label>Tagline</label>
        <input id="tagline" type="text">

        <label>Introduction</label>
        <textarea id="introduction"></textarea>

        <label>Contact Email</label>
        <input id="email" type="email">

        <label>LinkedIn URL</label>
        <input id="linkedin" type="url">

        <label>Instagram URL</label>
        <input id="instagram" type="url">

        <button class="form-button" id="saveProfile">
            Save Profile
        </button>
    </div>

    <!-- PROJECT AND CONTENT MANAGEMENT -->

    <div class="card">
        <h3>Add Projects and Portfolio Content</h3>

        <label>Section Key</label>
        <select id="sectionKey">
            <option value="projects">Projects</option>
            <option value="certificates">Certificates</option>
            <option value="about">About Me</option>
        </select>

        <label>Section Title</label>
        <input id="sectionTitle" type="text"
               placeholder="Enter project or certificate title">

        <label>Description / Full Details</label>
        <textarea id="contentText"
                  placeholder="Enter complete details"></textarea>

        <button class="form-button" id="addContent">
            Add Content
        </button>
    </div>

    <!-- EXISTING CONTENT -->

    <div class="card">
        <h3>Manage Existing Content</h3>
        <div id="contentList">Loading content...</div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://ghpgtnxaryfbdullyovt.supabase.co";
const SUPABASE_KEY = "sb_publishable_13b0nBZK1OvIjrgr7cV7ZA_UM04_k7u";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let settingsId = null;

const message = document.getElementById("message");

function showMessage(text, success = true) {
    message.textContent = text;
    message.style.color = success ? "green" : "red";
}

async function startDashboard() {
    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {
        window.location.replace("admin.html");
        return;
    }

    currentUser = data.session.user;

    // Confirm the authenticated session
    const { error: authError } = await db.auth.getUser();

    if (authError) {
        window.location.replace("admin.html");
        return;
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    await loadProfile();
    await loadContent();
}

// LOAD PROFILE

async function loadProfile() {
    const { data, error } = await db
        .from("site_settings")
        .select("*")
        .limit(1)
        .maybeSingle();

    if (error) {
        showMessage("Profile loading error: " + error.message, false);
        return;
    }

    if (!data) {
        showMessage("No profile record found.", false);
        return;
    }

    settingsId = data.id;

    document.getElementById("displayName").value =
        data.display_name || "";

    document.getElementById("tagline").value =
        data.tagline || "";

    document.getElementById("introduction").value =
        data.introduction || "";

    document.getElementById("email").value =
        data.email || "";

    document.getElementById("linkedin").value =
        data.linkedin_url || "";

    document.getElementById("instagram").value =
        data.instagram_url || "";
}

// SAVE PROFILE

document.getElementById("saveProfile").onclick =
async function() {

    if (settingsId === null) {
        showMessage("Profile record is missing.", false);
        return;
    }

    const { error } = await db
        .from("site_settings")
        .update({
            display_name: document.getElementById("displayName").value,
            tagline: document.getElementById("tagline").value,
            introduction: document.getElementById("introduction").value,
            email: document.getElementById("email").value,
            linkedin_url: document.getElementById("linkedin").value,
            instagram_url: document.getElementById("instagram").value,
            updated_at: new Date().toISOString()
        })
        .eq("id", settingsId);

    if (error) {
        showMessage("Save failed: " + error.message, false);
    } else {
        showMessage("Profile updated successfully!");
    }
};

// ADD CONTENT

document.getElementById("addContent").onclick =
async function() {

    const sectionKey =
        document.getElementById("sectionKey").value;

    const sectionTitle =
        document.getElementById("sectionTitle").value.trim();

    const contentText =
        document.getElementById("contentText").value.trim();

    if (!sectionTitle || !contentText) {
        showMessage("Please enter a title and description.", false);
        return;
    }

    const { error } = await db
        const { error } = await db
    .from("content_items")
    .insert({
        section_key: sectionKey,
        section_title: sectionKey === "projects" ? "Projects" :
                       sectionKey === "certificates" ? "Certificates" : "About Me",
        title: sectionTitle,
        body: contentText,
        created_by: currentUser.id
    });

    if (error) {
        showMessage("Content error: " + error.message, false);
    } else {
        showMessage("Content added successfully!");

        document.getElementById("sectionTitle").value = "";
        document.getElementById("contentText").value = "";

        await loadContent();
    }
};

// LOAD CONTENT

async function loadContent() {

    const list = document.getElementById("contentList");

    list.textContent = "Loading content...";

    const { data, error } = await db
        .from("content_items")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
        list.textContent = "Unable to load content: " + error.message;
        return;
    }

    list.innerHTML = "";

    if (!data || data.length === 0) {
        list.textContent = "No content added yet.";
        return;
    }

    data.forEach(item => {

        const div = document.createElement("div");
        div.className = "item";

        const heading = document.createElement("h4");
        heading.textContent = item.section_title;

        const category = document.createElement("p");
        category.textContent = "Section: " + item.section_key;

        const description = document.createElement("p");
        description.textContent = item.text;

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "secondary";

        editButton.onclick = () => editContent(item);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.onclick = () => deleteContent(item.id);

        div.append(heading, category, description,
                   editButton, deleteButton);

        list.appendChild(div);
    });
}

// EDIT CONTENT

async function editContent(item) {

    const newTitle = prompt("Enter new title:", item.section_title);

    if (newTitle === null) return;

    const newText = prompt("Enter new description:", item.text);

    if (newText === null) return;

    if (!newTitle.trim() || !newText.trim()) {
        showMessage("Title and description cannot be empty.", false);
        return;
    }

    const { error } = await db
        .from("content_items")
        .update({
            section_title: newTitle.trim(),
            text: newText.trim()
        })
        .eq("id", item.id);

    if (error) {
        showMessage("Update failed: " + error.message, false);
    } else {
        showMessage("Content updated successfully!");
        await loadContent();
    }
}

// DELETE CONTENT

async function deleteContent(id) {

    if (!confirm("Are you sure you want to delete this content?")) {
        return;
    }

    const { error } = await db
        .from("content_items")
        .delete()
        .eq("id", id);

    if (error) {
        showMessage("Delete failed: " + error.message, false);
    } else {
        showMessage("Content deleted successfully!");
        await loadContent();
    }
}

// LOGOUT

document.getElementById("logoutBtn").onclick =
async function() {

    const { error } = await db.auth.signOut();

    if (error) {
        showMessage("Logout failed: " + error.message, false);
        return;
    }

    window.location.replace("admin.html");
};

startDashboard();
</script>

</body>
</html>
