<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #172554;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Administrator Login</h2>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Administrator Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const SUPABASE_URL = "https://ghpgtnxaryfbdullyovt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_13b0nBZK1OvIjrgr7cV7ZA_UM04_k7u";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                const button =
                    document.getElementById("loginButton");

                button.disabled = true;
                button.textContent = "Logging in...";
                message.textContent = "";

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    message.textContent = error.message;
                    message.style.color = "red";
                    button.disabled = false;
                    button.textContent = "Login";
                    return;
                }

                message.textContent =
    "Login successful! Administrator authenticated.";

message.style.color = "green";

button.textContent = "Login successful!";

setTimeout(function() {
    window.location.href = "dashboard.html";
}, 1500);
            }
        );
    </script>

</body>
</html>
