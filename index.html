<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Portfolio</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172554;
        }

        header {
            background: #102a43;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        section {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
        }
.profile-image img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid white;
}
        footer {
            text-align: center;
            padding: 25px;
            background: #102a43;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to My Portfolio</h1>

    <div class="profile-image">
        <img id="profile-image"
             src="https://via.placeholder.com/150"
             alt="Profile Photo">
    </div>

    <h2 id="display-name">Your Name</h2>

    <p id="tagline">Your Tagline</p>

    <p>My Professional Journey, Projects and Achievements</p>
</header>

<main>

    <section>
        <h2>About Me</h2>
        <p id="introduction">
            Welcome to my personal portfolio website.
        </p>
    </section>

    <section>
        <h2>My Projects</h2>
        <div id="projects-list">
            Loading projects...
        </div>
    </section>

    <section>
        <h2>Certificates</h2>
        <div id="certificates-list">
            Loading certificates...
        </div>
    </section>

    <section>
        <h2>Contact</h2>
        <p id="contact-email">Email</p>
        <p id="contact-linkedin">LinkedIn</p>
        <p id="contact-instagram">Instagram</p>
    </section>

</main>

<footer>
    My Professional Portfolio
</footer>

<script>
    const SUPABASE_URL = "https://ghpgtnxaryfbdullyovt.supabase.co";

    const SUPABASE_KEY = "sb_publishable_13b0nBZK1OvIjrgr7cV7ZA_UM04_k7u";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    console.log("Supabase client initialized");
    // Load personal information
async function loadSiteSettings() {
    const { data, error } = await supabaseClient
        .from("site_settings")
        .select("*")
        .eq("id", true)
        .single();

    if (error) {
        console.error("Settings error:", error);
        return;
    }

    document.getElementById("display-name").textContent =
    data.display_name || "Your Name";

document.getElementById("tagline").textContent =
    data.tagline || "Your Tagline";

document.getElementById("introduction").textContent =
    data.introduction || "Welcome to my portfolio.";

    document.getElementById("contact-email").textContent =
        data.email || "Email not added";

    document.getElementById("contact-linkedin").textContent =
        data.linkedin_url || "LinkedIn not added";

    document.getElementById("contact-instagram").textContent =
        data.instagram_url || "Instagram not added";
    // LOAD PROFILE PHOTOGRAPH

if (data.avatar_path) {
    const { data: imageData } = supabaseClient
        .storage
        .from("portfolio-files")
        .getPublicUrl(data.avatar_path);

    document.getElementById("profile-image").src =
        imageData.publicUrl;
}
}

// Load projects and certificates
async function loadContent() {
    const { data, error } = await supabaseClient
        .from("content_items")
        .select("*")
        .eq("is_published", true)
        .order("sort_order", { ascending: true });

    if (error) {
        console.error("Content error:", error);
        return;
    }

    const projects = document.getElementById("projects-list");
    const certificates = document.getElementById("certificates-list");

    projects.textContent = "";
    certificates.textContent = "";

    data.forEach(item => {
    const section = document.createElement("div");
    const key = (item.section_key || "").toLowerCase();

    if (key.includes("project")) {
        section.className = "project-card";

        const heading = document.createElement("h3");
        heading.textContent = item.title;
        section.appendChild(heading);

        const link = document.createElement("a");

        if (item.external_url) {
            link.href = item.external_url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
        } else {
            link.href = "project.html?id=" + encodeURIComponent(item.id);
        }

        link.textContent = "View full project";
        section.appendChild(link);

        projects.appendChild(section);

    } else if (key.includes("certificate")) {
        const heading = document.createElement("h3");
        heading.textContent = item.title;
        section.appendChild(heading);

        if (item.body) {
            const description = document.createElement("p");
            description.textContent = item.body;
            section.appendChild(description);
        }

        if (item.external_url) {
            const link = document.createElement("a");
            link.href = item.external_url;
            link.textContent = "View certificate";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            section.appendChild(link);
        }

        certificates.appendChild(section);
    }
});

    if (!projects.children.length) {
        projects.textContent = "No published projects yet.";
    }

    if (!certificates.children.length) {
        certificates.textContent = "No published certificates yet.";
    }
}

// Start loading website content
loadSiteSettings();
loadContent();
</script>

</body>
</html>
